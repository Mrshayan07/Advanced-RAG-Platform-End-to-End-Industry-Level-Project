name: Advanced RAG CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-db-pass-7f4a9c2e
          POSTGRES_DB: ragdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ragdb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports:
          - 6333:6333

    env:
      APP_ENV: test
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://postgres:ci-only-db-pass-7f4a9c2e@localhost:5432/ragdb_test
      QDRANT_URL: http://localhost:6333
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-jwt-secret-9d3e7b1a-not-for-production
      LANGSMITH_TRACING: "false"
      GROQ_API_KEY: ""
      GEMINI_API_KEY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify test database target
        run: python -c "from scripts.database_safety import require_test_database; require_test_database(); print('Test database target verified')"

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run backend tests
        run: pytest -v --tb=short

  frontend-checks:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned secret scanner
        run: python -m pip install detect-secrets==1.5.0

      - name: Validate secrets baseline against tracked files
        shell: bash
        run: |
          git ls-files -z | grep -zv '^\.secrets\.baseline$' | xargs -0 detect-secrets-hook --baseline .secrets.baseline
